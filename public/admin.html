<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin - newsharbor</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', sans-serif; background: #f8fafc; color: #0f172a; line-height: 1.5; }
    .container { max-width: 1000px; margin: 40px auto; padding: 0 20px; }
    .card { background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 24px; margin-bottom: 24px; }
    h1, h2 { margin-bottom: 16px; }
    .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
    .btn {
      padding: 10px 18px; border-radius: 8px; border: none; font-weight: 600;
      cursor: pointer; font-size: 14px; text-decoration: none; display: inline-block;
    }
    .btn-primary { background: #0f172a; color: #fff; }
    .btn-secondary { background: #e2e8f0; color: #0f172a; }
    .btn-danger { background: #ef4444; color: #fff; padding: 6px 12px; font-size: 13px; }
    .btn-edit { background: #3b82f6; color: #fff; padding: 6px 12px; font-size: 13px; }
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 6px; }
    .form-group input, .form-group textarea {
      width: 100%; padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-family: inherit; font-size: 14px;
    }
    .preview-img { max-width: 280px; border-radius: 8px; margin-top: 10px; display: none; border: 1px solid #e2e8f0; }
    .story-item {
      display: flex; align-items: center; gap: 16px; padding: 14px 0; border-bottom: 1px solid #f1f5f9;
    }
    .story-item:last-child { border-bottom: none; }
    .story-item img { width: 100px; height: 60px; object-fit: cover; border-radius: 6px; flex-shrink: 0; }
    .story-info { flex: 1; }
    .story-info h3 { font-size: 16px; margin-bottom: 4px; }
    .story-info span { font-size: 13px; color: #64748b; }
    .actions { display: flex; gap: 8px; }
    .hidden { display: none; }
    .login-box { max-width: 400px; margin: 100px auto; }
  </style>
</head>
<body>
  <!-- Màn hình đăng nhập -->
  <div id="login-screen" class="login-box card">
    <h2>Đăng nhập Admin</h2>
    <form onsubmit="login(event)">
      <div class="form-group">
        <label>Mật khẩu quản trị</label>
        <input type="password" id="password-input" placeholder="Nhập mật khẩu (mặc định: admin123)" required />
      </div>
      <button type="submit" class="btn btn-primary" style="width: 100%;">Đăng nhập</button>
    </form>
  </div>

  <!-- Màn hình quản lý -->
  <div id="admin-screen" class="container hidden">
    <div class="header-bar">
      <h1>Quản lý truyện newsharbor</h1>
      <div style="display: flex; gap: 10px;">
        <a href="/" target="_blank" class="btn btn-secondary">Xem trang chủ</a>
        <button onclick="logout()" class="btn btn-secondary">Đăng xuất</button>
      </div>
    </div>

    <!-- Form Thêm / Sửa truyện -->
    <div class="card">
      <h2 id="form-title">Đăng truyện mới</h2>
      <form id="story-form" onsubmit="saveStory(event)">
        <input type="hidden" id="story-id" />
        <div class="form-group">
          <label>Tiêu đề truyện</label>
          <input type="text" id="story-title" placeholder="Nhập tiêu đề..." required />
        </div>
        <div class="form-group">
          <label>Ngày hiển thị (ví dụ: Sep 03, 2026 - để trống sẽ lấy hôm nay)</label>
          <input type="text" id="story-date" placeholder="Sep 03, 2026" />
        </div>
        <div class="form-group">
          <label>Upload ảnh bìa từ máy tính</label>
          <input type="file" id="image-file" accept="image/*" onchange="uploadImage(this)" />
          <label style="margin-top: 10px;">Hoặc dán link ảnh bìa (URL)</label>
          <input type="text" id="story-image" placeholder="https://..." oninput="showPreview(this.value)" />
          <img id="image-preview" class="preview-img" src="" alt="Preview" />
        </div>
        <div class="form-group">
          <label>Nội dung truyện (mỗi lần nhấn Enter xuống dòng là 1 đoạn văn)</label>
          <textarea id="story-content" rows="8" placeholder="Nhập nội dung truyện..." required></textarea>
        </div>
        <div style="display: flex; gap: 10px;">
          <button type="submit" class="btn btn-primary" id="submit-btn">Xuất bản truyện</button>
          <button type="button" class="btn btn-secondary hidden" id="cancel-btn" onclick="resetForm()">Hủy sửa</button>
        </div>
      </form>
    </div>

    <!-- Danh sách truyện đã đăng -->
    <div class="card">
      <h2>Danh sách truyện (<span id="story-count">0</span>)</h2>
      <div id="story-list"></div>
    </div>
  </div>

  <script>
    let adminPassword = sessionStorage.getItem('adminPassword') || '';

    if (adminPassword) {
      showAdmin();
    }

    async function login(e) {
      e.preventDefault();
      const pw = document.getElementById('password-input').value;
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: pw })
      });
      if (res.ok) {
        adminPassword = pw;
        sessionStorage.setItem('adminPassword', pw);
        showAdmin();
      } else {
        alert('Sai mật khẩu!');
      }
    }

    function logout() {
      sessionStorage.removeItem('adminPassword');
      location.reload();
    }

    function showAdmin() {
      document.getElementById('login-screen').classList.add('hidden');
      document.getElementById('admin-screen').classList.remove('hidden');
      loadStories();
    }

    async function loadStories() {
      const res = await fetch('/api/stories');
      const stories = await res.json();
      document.getElementById('story-count').textContent = stories.length;
      const list = document.getElementById('story-list');
      list.innerHTML = '';

      stories.forEach((s) => {
        const item = document.createElement('div');
        item.className = 'story-item';
        item.innerHTML = `
          <img src="${s.image}" alt="" />
          <div class="story-info">
            <h3>${escapeHtml(s.title)}</h3>
            <span>${escapeHtml(s.date)}</span>
          </div>
          <div class="actions">
            <a href="/story/${s.id}" target="_blank" class="btn btn-secondary" style="padding:6px 12px;font-size:13px;">Xem</a>
            <button class="btn btn-edit" onclick='editStory(${JSON.stringify(s).replace(/'/g, "&#39;")})'>Sửa</button>
            <button class="btn btn-danger" onclick="deleteStory('${s.id}')">Xóa</button>
          </div>
        `;
        list.appendChild(item);
      });
    }

    async function uploadImage(input) {
      if (!input.files[0]) return;
      const formData = new FormData();
      formData.append('image', input.files[0]);

      const res = await fetch('/api/upload', {
        method: 'POST',
        headers: { 'x-admin-password': adminPassword },
        body: formData
      });
      if (res.ok) {
        const data = await res.json();
        document.getElementById('story-image').value = data.url;
        showPreview(data.url);
      } else {
        alert('Lỗi upload ảnh!');
      }
    }

    function showPreview(url) {
      const img = document.getElementById('image-preview');
      if (url) {
        img.src = url;
        img.style.display = 'block';
      } else {
        img.style.display = 'none';
      }
    }

    async function saveStory(e) {
      e.preventDefault();
      const id = document.getElementById('story-id').value;
      const payload = {
        title: document.getElementById('story-title').value,
        date: document.getElementById('story-date').value,
        image: document.getElementById('story-image').value,
        content: document.getElementById('story-content').value
      };

      const url = id ? `/api/stories/${id}` : '/api/stories';
      const method = id ? 'PUT' : 'POST';

      const res = await fetch(url, {
        method,
        headers: {
          'Content-Type': 'application/json',
          'x-admin-password': adminPassword
        },
        body: JSON.stringify(payload)
      });

      if (res.ok) {
        alert(id ? 'Đã cập nhật truyện!' : 'Đã đăng truyện mới!');
        resetForm();
        loadStories();
      } else {
        alert('Có lỗi xảy ra hoặc hết phiên đăng nhập.');
      }
    }

    function editStory(story) {
      document.getElementById('form-title').textContent = 'Chỉnh sửa truyện';
      document.getElementById('submit-btn').textContent = 'Lưu thay đổi';
      document.getElementById('cancel-btn').classList.remove('hidden');

      document.getElementById('story-id').value = story.id;
      document.getElementById('story-title').value = story.title;
      document.getElementById('story-date').value = story.date;
      document.getElementById('story-image').value = story.image;
      document.getElementById('story-content').value = story.content.join('\n\n');
      showPreview(story.image);
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    async function deleteStory(id) {
      if (!confirm('Bạn có chắc muốn xóa truyện này?')) return;
      const res = await fetch(`/api/stories/${id}`, {
        method: 'DELETE',
        headers: { 'x-admin-password': adminPassword }
      });
      if (res.ok) loadStories();
    }

    function resetForm() {
      document.getElementById('story-form').reset();
      document.getElementById('story-id').value = '';
      document.getElementById('form-title').textContent = 'Đăng truyện mới';
      document.getElementById('submit-btn').textContent = 'Xuất bản truyện';
      document.getElementById('cancel-btn').classList.add('hidden');
      showPreview('');
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }
  </script>
</body>
</html>
